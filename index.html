<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<title>Ortho Unit</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --navy:#1f3a5f; --navy2:#2c5282; --bg:#f3f5f9; --line:#e2e7ef; --text:#1a202c; --muted:#6b7686; --red:#c53030;
  --c-admitted:#2b6cb0; --c-operated:#6b46c1; --c-discharged:#2f855a; --c-waiting:#b7791f; --c-readmitted:#c53030;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
header h1{margin:0;font-size:18px;font-weight:650;display:flex;align-items:center;gap:8px;flex:1}
.bar{display:flex;align-items:center;gap:8px}
.hbtn{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.back{background:transparent;border:0;color:#fff;font-size:24px;padding:0 6px 0 0;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:12px 12px 110px}
.search{width:100%;margin-top:10px;padding:10px 12px;border-radius:10px;border:0;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--text);cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.row2{display:flex;gap:8px;align-items:center;margin-top:8px}
.row2 select{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:#fff}
.count{font-size:12px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;cursor:pointer;border-left:5px solid var(--navy)}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .name{font-weight:650;font-size:16px}
.card .dx{color:var(--muted);font-size:13px;margin-top:2px}
.card .note{font-size:13px;margin-top:6px;white-space:pre-wrap}
.badge{display:inline-block;color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.due{font-size:12px;font-weight:600;margin-top:6px;display:inline-block;padding:2px 8px;border-radius:6px;background:#edf2f7;color:var(--muted)}
.due.over{background:#fed7d7;color:var(--red)}
.due.soon{background:#feebc8;color:#9c4221}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:6;background:var(--navy);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.sec{background:#fff;border:1px solid var(--line);border-radius:12px;margin:12px 0;overflow:hidden}
.sec h2{margin:0;font-size:14px;letter-spacing:.3px;text-transform:uppercase;color:#fff;background:var(--navy2);padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
.sec h2 button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;text-transform:none;letter-spacing:0}
.sec .in{padding:10px 12px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px}
.kv .k{color:var(--muted)}
.kv .v{white-space:pre-wrap;word-break:break-word}
.status-now{border-radius:10px;padding:10px;color:#fff}
.status-now .lbl{font-weight:700;font-size:16px}
.status-now .meta{font-size:13px;opacity:.95;margin-top:2px}
.status-now .txt{margin-top:6px;white-space:pre-wrap}
.tl{margin:12px 0 0 6px;padding:0;list-style:none;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 12px 14px;font-size:14px}
.tl li::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--dot,#999);border:2px solid #fff}
.tl .t{font-weight:600}.tl .d{color:var(--muted);font-size:12px}.tl .n{white-space:pre-wrap}
.tl .x{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:0;margin-left:6px}
.pgroup{margin-bottom:10px}
.pgroup .gt{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.tile{position:relative;aspect-ratio:1;border-radius:8px;background:#e2e8f0;overflow:hidden;cursor:pointer}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;text-shadow:0 1px 4px #000}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:600;cursor:pointer;background:#e2e8f0;color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.pri{background:var(--navy);color:#fff}
.btn.wa{background:#25d366;color:#fff;font-size:16px;padding:14px}
.btn.wa[disabled]{background:#9ae6b4}
.btn.danger{background:#fff;color:var(--red);border:1px solid #feb2b2}
.btn.full{width:100%}
label.f{display:block;margin:10px 0 4px;font-size:13px;font-weight:600;color:#2d3748}
.inp{width:100%;padding:10px;border:1px solid #cbd5e0;border-radius:8px;background:#fff;font-size:15px}
textarea.inp{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.stpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.stpick button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px 6px;font-weight:600;cursor:pointer}
.stpick button.on{color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:600px){.modal{align-items:center}.modal .box{border-radius:16px}}
.modal h3{margin:0 0 6px;font-size:17px}
.viewer{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
.viewer .media{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;color:#aaa}
.viewer img,.viewer video{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vb{display:flex;justify-content:space-between;align-items:center;padding:10px;color:#fff;gap:8px;font-size:13px}
.viewer .vb button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1a202c;color:#fff;padding:10px 16px;border-radius:10px;z-index:40;font-size:14px;max-width:90vw;text-align:center}
.notice{background:#fffaf0;border:1px solid #fbd38d;color:#7b341e;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.small{font-size:12px;color:var(--muted)}
.tile.sel{outline:3px solid var(--navy2);outline-offset:-3px}
.tile.sel::after{content:'✓';position:absolute;top:4px;right:4px;background:var(--navy2);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:14px}
.selbar{position:sticky;bottom:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 -2px 10px rgba(0,0,0,.08)}
.sugg{display:none;flex-wrap:wrap;gap:6px;margin-top:6px}
.sugg button{border:1px solid #bee3f8;background:#ebf8ff;color:#2a4365;border-radius:999px;padding:6px 10px;font-size:13px;cursor:pointer}
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.addrow .btn{background:#ebf4ff;color:var(--navy2);border:1px dashed #90cdf4;padding:12px 8px}
.picked{font-size:13px;margin-top:8px;color:var(--text)}
.prog{height:6px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-top:6px}
.prog div{height:100%;background:var(--navy2);width:0}
</style>
</head>
<body>
<header id="hdr"></header>
<main class="wrap" id="main"><div class="empty">Loading…</div></main>
<div id="layer"></div>

<script>
/* ================= constants ================= */
const STATUSES = {
  admitted:   {label:"Admitted",   color:"var(--c-admitted)",   date:"Admission date",   note:"Notes (e.g. what is delaying surgery)"},
  operated:   {label:"Operated",   color:"var(--c-operated)",   date:"Surgery date",     note:"What was done (e.g. Ex Fx, ORIF with P&S)"},
  discharged: {label:"Discharged", color:"var(--c-discharged)", date:"Discharge date",   note:"Condition at discharge"},
  readmitted: {label:"Readmitted", color:"var(--c-readmitted)", date:"Readmission date", note:"Reason (Ex Fx removal, debridement, fixation…)"},
  waiting:    {label:"Waiting",    color:"var(--c-waiting)",    date:"Since",            note:"", hidden:true}
};
const PICK = Object.keys(STATUSES).filter(k=>!STATUSES[k].hidden);
/* Photo groups. Each base (except ticket) has Old / New.
   "New" = the latest day that New files were added; earlier New files show as Old automatically. */
const BASES = {skin:["Skin",1], xray:["X-ray",1], ct:["CT",1], labs:["Labs",1], ticket:["Ticket",0], imaging:["X-ray / CT",0]};
const BASE_ORDER = ["skin","xray","ct","labs","ticket","imaging"];
function parseCat(c){c=String(c||"");if(c.includes("_")){const [b,a]=c.split("_");return{base:b,age:a}}
  if(c==="other")return{base:"labs",age:"new"};if(c==="xray")return{base:"imaging",age:""};
  if(c==="skin")return{base:"skin",age:"new"};return{base:c||"labs",age:BASES[c]&&BASES[c][1]?"new":""}}
function catLabel(c){const {base,age}=parseCat(c);return (BASES[base]?BASES[base][0]:base)+(age?" "+age:"")}
/* groups for a patient, display order: New first, then Old by date (newest first) */
function mediaGroups(p){
  const mc=p.mediaCat||{}, ov=p.mediaAge||{}, out=[];
  const all=media.filter(m=>m.patientId===p.id).map(m=>mc[m.id]?Object.assign({},m,{cat:mc[m.id].cat,date:mc[m.id].date||m.date}):m);
  for(const base of BASE_ORDER){
    const items=all.filter(m=>parseCat(m.cat).base===base).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));if(!items.length)continue;
    if(!BASES[base][1]){out.push({base,age:"",label:BASES[base][0]+(base==="imaging"?" (earlier uploads)":""),items});continue}
    const tag=m=>ov[m.id]?ov[m.id].age:parseCat(m.cat).age, eff=m=>ov[m.id]&&ov[m.id].age==="new"?ov[m.id].at:m.date;
    const newDate=items.filter(m=>tag(m)==="new").map(eff).sort().pop();
    const isNew=m=>tag(m)==="new"&&eff(m)===newDate;
    const nw=items.filter(isNew);
    if(nw.length)out.push({base,age:"new",date:newDate,label:`${BASES[base][0]} — New · ${fmt(newDate)}`,items:nw});
    const old=items.filter(m=>!isNew(m)),dates=[...new Set(old.map(m=>m.date))].sort().reverse();
    dates.forEach(d=>out.push({base,age:"old",date:d,label:`${BASES[base][0]} — Old · ${fmt(d)}`,items:old.filter(m=>m.date===d)}));
  }
  return out;
}
function mediaOf(pid){const p=patients.find(x=>x.id===pid)||{id:pid};return mediaGroups(p).flatMap(g=>g.items)}
/* sending order: per section, oldest first then new */
function shareGroups(p){const g=mediaGroups(p),out=[];for(const base of BASE_ORDER){const gs=g.filter(x=>x.base===base);
  out.push(...gs.filter(x=>x.age==="old").reverse(),...gs.filter(x=>x.age!=="old"))}return out}
const ADD_BTNS = [["skin","Skin",1],["xray","X-ray",1],["ct","CT",1],["labs","Labs",1],["ticket","Ticket"]];
const addButtons = (type) => `<div class="addrow">${ADD_BTNS.map(([k,l,ask])=>`<button ${type?'type="button"':""} class="btn addcat" data-cat="${k}" data-ask="${ask?1:""}">📷 + ${l}</button>`).join("")}</div>`;
/* Learned suggestions: seeds + everything typed before */
const SEEDS = {mot:["RTA","FFH","FOG","Assault","Sports injury"], vitals:["Stable","Unstable"], nv:["Intact"],
  medHx:["Free","DM","HTN"], surgHx:["Free"], gs:["Free"], ns:["Free"],
  procedure:["ORIF with plate & screws","CRIF with K-wires","Ex Fx","Debridement","Removal of plate & screws","IM nail"]};
const LINE_FIELDS = {diagnosis:1, procedure:1, note:1, medHx:1, surgHx:1};
const FIELDS = ["name","age","sex","fileNo","phone","consultant","mot","vitals","diagnosis","nv","medHx","surgHx","gs","ns","procedure","notes"];
const DEFAULTS = {vitals:"Stable", nv:"Intact", medHx:"Free", surgHx:"Free", gs:"Free", ns:"Free"};

/* Compression settings — as small as possible while X-rays stay readable */
const IMG_MAX = 1400, IMG_Q = 0.7;          // photos
const VID_MAX = 720, VID_FPS = 24, VID_BPS = 700000; // videos (~5 MB per minute)
const THUMB = 220;

/* ================= state ================= */
let CFG = loadCfg();
let patients = [], media = [], loaded = false, loadErr = "", lastLoad = 0;
let filter = {q:"", status:"all", consultant:""};
const thumbs = {};          // mediaId -> dataURL
let shownForm = null;
let sel={pid:null,ids:new Set()};
let installEvt = null;

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmt(d){if(!d)return"";const p=String(d).split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d}
function daysTo(d){if(!d)return null;return Math.round((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/86400000)}
function newId(){return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function toast(m,ms){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms||2800)}
function st(c){return STATUSES[c]||{label:c||"—",color:"#718096",date:"Date",note:"Notes",due:"Due date"}}
function nextDateOf(p){return p.nextDate||(p.nextStep===undefined?p.dueDate:"")||""}
function nextStepOf(p){return p.nextStep!==undefined?p.nextStep:(p.status==="waiting"?p.statusNote:"")||""}
function dueInfo(p){const dt=nextDateOf(p),n=daysTo(dt);if(n===null)return null;
  if(n<0)return{cls:"over",txt:`${fmt(dt)} — overdue ${-n}d`};
  if(n===0)return{cls:"over",txt:`today`};
  if(n<=7)return{cls:"soon",txt:`${fmt(dt)} — in ${n}d`};
  return{cls:"",txt:fmt(dt)}}
function admissionNo(p,upto){let n=0;for(const h of sortedHist(p)){if(h.status==="admitted"||h.status==="readmitted")n++;if(h._i===upto._i)break}return n}
const KIND={admitted:"adm",readmitted:"adm",operated:"op",discharged:"dis"}, KWORD={adm:"admission",op:"operation",dis:"discharge"};
function kindCount(p,k){return (p.history||[]).filter(h=>KIND[h.status]===k).length}
/* "2nd discharge" etc. — shown when that kind happened more than once */
function stepTag(p,h,short){const k=KIND[h.status];if(!k)return"";const total=kindCount(p,k);if(total<2)return"";
  let n=0;for(const x of sortedHist(p)){if(KIND[x.status]===k)n++;if(x._i===h._i)break}
  return short?` (${ord(n)})`:` · ${ord(n)} ${KWORD[k]}`}
function sortedHist(p){return [...(p.history||[])].map((h,i)=>Object.assign({_i:i},h)).sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.at||0)-(b.at||0)||a._i-b._i)}
function ord(n){return n+(n%100>=11&&n%100<=13?"th":["th","st","nd","rd"][n%10]||"th")}
function readmits(p){return (p.history||[]).filter(h=>h.status==="readmitted"||h.status==="admitted").length}
function mb(n){return (n/1048576).toFixed(n<10485760?1:0)+" MB"}

function loadCfg(){try{return JSON.parse(localStorage.getItem("ortho_cfg")||"null")}catch(e){return null}}
function saveCfg(c){CFG=c;try{localStorage.setItem("ortho_cfg",JSON.stringify(c))}catch(e){}}

/* ================= API ================= */
async function api(action, payload){
  const r = await fetch(CFG.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(Object.assign({action,key:CFG.key,by:CFG.name},payload||{}))});
  if(!r.ok) throw new Error("Server error "+r.status);
  const j = await r.json();
  if(!j.ok) throw new Error(j.error==="wrong-key"?"Wrong unit password":j.error);
  return j.data;
}
async function refresh(silent){
  try{
    const d = await api("list");
    patients = d.patients||[]; media = d.media||[]; loaded = true; loadErr=""; lastLoad=Date.now();
    try{localStorage.setItem("ortho_cache",JSON.stringify({patients,media}))}catch(e){}
  }catch(e){ loadErr = "Couldn't reach the server: "+e.message; loaded = true; if(!silent) toast(loadErr) }
  render(true);
}

/* media files cache (Cache Storage) */
async function mediaCache(){try{return await caches.open("ortho-media-v1")}catch(e){return null}}
async function getBlob(m){
  const c = await mediaCache(); const key = "/__media/"+m.fileId;
  if(c){const hit = await c.match(key); if(hit) return await hit.blob();}
  const d = await api("getFile",{fileId:m.fileId});
  const bin = atob(d.b64); const u8 = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  const blob = new Blob([u8],{type:d.mime||m.mime});
  if(c){try{await c.put(key,new Response(blob))}catch(e){}}
  return blob;
}
async function loadThumbs(pid){
  const need = mediaOf(pid).filter(m=>!(m.id in thumbs)); if(!need.length) return;
  try{const t = await api("thumbs",{patientId:pid}); Object.assign(thumbs,t);
    need.forEach(m=>{if(!(m.id in thumbs))thumbs[m.id]=""});
  }catch(e){}
}

/* ================= boot ================= */
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;render(true)});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
window.addEventListener("hashchange",()=>render());
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&CFG&&Date.now()-lastLoad>30000)refresh(true)});
setInterval(()=>{if(!document.hidden&&CFG&&route().v==="list")refresh(true)},60000);

(function boot(){
  // setup link from a colleague:  #setup=<base64>
  const m = location.hash.match(/^#setup=(.+)$/);
  if(m){try{const s=JSON.parse(decodeURIComponent(escape(atob(m[1]))));window.__setup=s}catch(e){} history.replaceState(null,"",location.pathname)}
  if(!CFG){ renderSetup(); return; }
  try{const c=JSON.parse(localStorage.getItem("ortho_cache")||"null");if(c){patients=c.patients||[];media=c.media||[];loaded=true}}catch(e){}
  render(); refresh(true);
})();

/* ================= setup screen ================= */
function renderSetup(){
  const s = window.__setup||CFG||{};
  $("#hdr").innerHTML=`<div class="bar"><h1>🦴 Ortho Unit — setup</h1></div>`;
  $("#main").innerHTML=`<div class="sec"><h2>Connect</h2><div class="in">
    <label class="f">Server link</label><input class="inp" id="su" value="${esc(s.url||"")}" placeholder="https://script.google.com/macros/s/…/exec">
    <label class="f">Unit password</label><input class="inp" id="sk" value="${esc(s.key||"")}">
    <label class="f">Your name</label><input class="inp" id="sn" value="${esc((CFG&&CFG.name)||"")}" placeholder="Dr. …">
    <div class="hint">Your name appears beside every change you make.</div>
    <div class="actions"><button class="btn pri full" id="sgo">Connect</button></div>
    <div id="smsg" class="small" style="margin-top:8px"></div></div></div>`;
  $("#sgo").onclick=async()=>{
    const c={url:$("#su").value.trim(),key:$("#sk").value.trim(),name:$("#sn").value.trim()};
    if(!c.url||!c.key||!c.name){toast("Fill all three fields");return}
    $("#smsg").textContent="Checking…"; const old=CFG; CFG=c;
    try{await api("ping"); saveCfg(c); location.hash=""; render(); refresh();}
    catch(e){CFG=old; $("#smsg").textContent="Couldn't connect: "+e.message}
  };
}
function settingsModal(){
  const link = location.origin+location.pathname+"#setup="+btoa(unescape(encodeURIComponent(JSON.stringify({url:CFG.url,key:CFG.key}))));
  const b = modal(`<h3>Settings</h3>
    <div class="small">Signed in as <b>${esc(CFG.name)}</b></div>
    <label class="f">Invite a colleague</label>
    <div class="hint">Send this link to a unit member. They open it, write their name, and install the app.</div>
    <div class="actions"><a class="btn wa full" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent("Ortho Unit patient app — open this link, enter your name, then tap Install:\n"+link)}">Send invite on WhatsApp</a></div>

function route(){const h=location.hash.slice(1);
  if(h==="new")return{v:"form"};
  if(h.startsWith("edit-"))return{v:"form",id:h.slice(5)};
  if(h.startsWith("p-"))return{v:"detail",id:h.slice(2)};
  return{v:"list"};}
function go(h){location.hash=h}
function render(fromData){
  if(!CFG) return renderSetup();
  const r=route();
  if(r.v==="form"){
    const ready=!r.id||patients.some(x=>x.id===r.id);
    if(shownForm===location.hash&&$("#f"))return;

function summary(p){
  const s=st(p.status),L=[],SEP="> ————————————";
  const val=(k)=>(p[k]||"").trim()||DEFAULTS[k]||"—";
  const sec=(title,v)=>{L.push("> "+title);L.push(v)};
  sec("Name, Age",`${p.name||""}${p.age?` ، ${p.age} سنة`:""}`);
  sec("MOT, Vitally",`${(p.mot||"").trim()||"—"} , ${val("vitals")}`);
  L.push(SEP);
  L.push("> Fractures");
  const fx=(p.diagnosis||"").split("\n").map(x=>x.trim()).filter(Boolean);
  (fx.length?fx:["—"]).forEach(x=>L.push(x.startsWith("#")||x==="—"?x:"# "+x));
  L.push(SEP);
  sec("NeuroVascular",val("nv"));
  L.push(SEP);
  sec("Medical History",val("medHx"));
  sec("Surgical History",val("surgHx"));
  L.push(SEP);
  sec("General Surgery",val("gs"));
  sec("Neurosurgery",val("ns"));
  if(p.procedure){L.push(SEP);sec("Procedure",p.procedure)}
  L.push(SEP);
  L.push("> Course");
  sortedHist(p).filter(h=>h.status!=="waiting").forEach(h=>{
    L.push(`• ${fmt(h.date)} — ${st(h.status).label}${stepTag(p,h,true)}${h.note?": "+h.note:""}`)});
  L.push(`Now: ${s.label}`);
  if(nextStepOf(p)||nextDateOf(p)){L.push(SEP);L.push("> Waiting for");L.push(`${nextStepOf(p)||"—"}${nextDateOf(p)?` — ${fmt(nextDateOf(p))}`:""}`)}
  if(p.consultant||p.fileNo||p.notes||p.phone){L.push(SEP);
    if(p.phone)sec("Phone",p.phone);
    if(p.consultant)sec("Consultant",p.consultant);
    if(p.fileNo)sec("File no.",p.fileNo);
    if(p.notes)sec("Notes",p.notes);}
  return L.join("\n");
}

function shareKey(p){return p.id+"|"+mediaOf(p.id).map(m=>m.id).join(",")+"|"+JSON.stringify(p.mediaAge||{})}
async function prepareShare(p){
  const key=shareKey(p);
  if(share.key===key&&(share.files||share.busy))return;
  const groups=shareGroups(p),ms=groups.flatMap(g=>g.items.map(m=>({m,g})));
  share={key,files:null,busy:true,done:0,total:ms.length};
  if(!ms.length){share.files=[];share.busy=false;updateShareState(p);return}
  const files=[];
  try{
    for(const {m,g} of ms){
      const b=await getBlob(m); if(share.key!==key)return;
      const ext=(b.type||m.mime||"").includes("mp4")?"mp4":(b.type||m.mime||"").includes("webm")?"webm":(m.kind==="video"?"mp4":"jpg");
      const nm=`${files.length+1} - ${BASES[g.base][0].replace(/[\/ ]+/g,"-")}${g.age?" "+g.age:""}${g.date?" "+fmt(g.date).replace(/\//g,"-"):""}.${ext}`;
      files.push(new File([b],nm,{type:b.type||m.mime}));
      share.done++; updateShareState(p);
    }
    share.files=files;
  }catch(e){share.err=e.message}
  share.busy=false; updateShareState(p);
}
function updateShareState(p){
  const el=$("#wastate"),btn=$("#wa"); if(!el||route().id!==p.id||share.key!==shareKey(p))return;
  if(share.busy){btn.disabled=true;btn.textContent=`Preparing photos… ${share.done}/${share.total}`;el.textContent="Getting files ready so one tap sends everything.";}
  else{btn.disabled=false;btn.textContent="Send on WhatsApp";
    el.textContent=share.err?"Some files couldn't be loaded — tap to send the text, or try again.":(share.total?`Sends the summary + ${share.total} file${share.total>1?"s":""} in order: skin → X-ray → CT → labs → ticket (old before new).`:"Sends the summary.");}
}
async function sendWhatsApp(p){
  const text=summary(p);
  const files=share.key===shareKey(p)?share.files:null;
  if(files&&files.length&&navigator.canShare&&navigator.canShare({files})){
    try{await navigator.share({text,files});return}
    catch(e){if(e.name==="AbortError")return; if(e.name!=="NotAllowedError"){toast("Sharing failed: "+e.message)}}
  }else if(!files||!files.length){
    if(navigator.share){try{await navigator.share({text});return}catch(e){if(e.name==="AbortError")return}}
  }
  window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");
  if(files&&files.length)toast("This phone can't attach files automatically — text sent only.");
}

function statusFields(box,cur){
  let sel=PICK.includes(cur.status)?cur.status:"admitted";
  const notes={};notes[sel]=cur.note||"";
  function draw(){const s=st(sel);
    box.innerHTML=`<div class="stpick">${PICK.map(k=>{const x=STATUSES[k];const nx=cur.counts&&KIND[k]&&cur.counts[KIND[k]]?` (${ord(cur.counts[KIND[k]]+1)})`:"";return`<button type="button" data-k="${k}" class="${k===sel?"on":""}" style="${k===sel?`background:${x.color};border-color:${x.color}`:`color:${x.color}`}">${x.label}${nx}</button>`}).join("")}</div>
    <label class="f">${esc(s.date)}</label><input class="inp" type="date" data-f="date" value="${esc(cur.date||today())}">
    <label class="f">${esc(s.note)}</label><textarea class="inp" data-f="note" data-learn="note">${esc(notes[sel]||"")}</textarea>`;
    box.dataset.status=sel;attachLearn(box);
    box.querySelectorAll(".stpick button").forEach(b=>b.onclick=()=>{const r=readStatus(box);notes[sel]=r.note;cur={date:r.date,counts:cur.counts};sel=b.dataset.k;draw()});}
  draw();
}
function readStatus(box){return{status:box.dataset.status,date:box.querySelector('[data-f="date"]').value||today(),note:box.querySelector('[data-f="note"]').value.trim()}}
function waitingFields(step,date){return `<label class="f">Waiting for what?</label>
  <textarea class="inp" id="nstep" data-learn="nextStep" placeholder="e.g. 3rd admission for ORIF / plate removal after 1 year / Ex Fx in 2 weeks">${esc(step)}</textarea>
  <label class="f">Planned date <span class="small">(optional)</span></label><input class="inp" type="date" id="ndate" value="${esc(date)}">
  <div class="hint">The patient list is sorted by this date: amber 7 days before, red when overdue.</div>`}

/* ================= learned suggestions ================= */
function learnedLocal(){try{return JSON.parse(localStorage.getItem("ortho_learn")||"{}")}catch(e){return{}}}
function remember(key,val){const L=learnedLocal();const items=(LINE_FIELDS[key]?String(val||"").split("\n"):[val]).map(x=>String(x||"").trim()).filter(Boolean);
  if(!items.length)return;L[key]=[...new Set([...(L[key]||[]),...items])].slice(-300);try{localStorage.setItem("ortho_learn",JSON.stringify(L))}catch(e){}}
function vocab(key){
  const cnt={};const add=(v,w)=>{(LINE_FIELDS[key]?String(v||"").split("\n"):[v]).forEach(x=>{x=String(x||"").trim();if(x&&x!=="—")cnt[x]=(cnt[x]||0)+(w||1)})};
  if(key==="note")patients.forEach(p=>(p.history||[]).forEach(h=>add(h.note)));
  else if(key==="nextStep")patients.forEach(p=>add(p.nextStep));
  else patients.forEach(p=>add(p[key]));
  (learnedLocal()[key]||[]).forEach(v=>add(v,0.5));(SEEDS[key]||[]).forEach(v=>add(v,0.1));
  return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
}
function attachLearn(root){
  root.querySelectorAll("[data-learn]").forEach(el=>{
    if(el.dataset.learnOn)return;el.dataset.learnOn="1";
    const key=el.dataset.learn,multi=!!LINE_FIELDS[key];
    const box=document.createElement("div");box.className="sugg";el.insertAdjacentElement("afterend",box);
    const token=()=>{if(!multi)return el.value;const v=el.value.slice(0,el.selectionStart??el.value.length);return v.split("\n").pop()};
    const draw=()=>{
      const t=token().trim().toLowerCase();
      const list=vocab(key).filter(x=>!t||x.toLowerCase().includes(t)).filter(x=>x.toLowerCase()!==t).slice(0,8);
      box.innerHTML=list.map(x=>`<button type="button">${esc(x)}</button>`).join("");
      box.style.display=list.length?"flex":"none";
      box.querySelectorAll("button").forEach((b,i)=>{b.onpointerdown=e=>e.preventDefault();b.onclick=()=>{
        const val=list[i];
        if(!multi)el.value=val;
        else{const pos=el.selectionStart??el.value.length;const before=el.value.slice(0,pos),after=el.value.slice(pos);
          const start=before.lastIndexOf("\n")+1;const nl=after.indexOf("\n");const rest=nl<0?"":after.slice(nl);
          el.value=before.slice(0,start)+val+rest;const c=start+val.length;el.setSelectionRange(c,c);}
        el.dispatchEvent(new Event("input"));el.focus();box.style.display="none";}});
    };
    el.addEventListener("focus",draw);el.addEventListener("input",draw);el.addEventListener("click",draw);
    el.addEventListener("blur",()=>setTimeout(()=>{box.style.display="none"},150));
  });
}
function rememberForm(root){root.querySelectorAll("[data-learn]").forEach(el=>remember(el.dataset.learn,el.value))}

/* ================= modals ================= */
function modal(html){const l=$("#layer");l.innerHTML=`<div class="modal"><div class="box">${html}</div></div>`;
  l.querySelector(".modal").addEventListener("click",e=>{if(e.target.classList.contains("modal")&&!l.dataset.lock)closeModal()});return l.querySelector(".box")}
function closeModal(){const l=$("#layer");l.innerHTML="";delete l.dataset.lock}
function confirmBox(title,text,ok){return new Promise(res=>{
  const b=modal(`<h3>${esc(title)}</h3><div style="margin:6px 0 14px">${esc(text)}</div><div class="actions"><button class="btn" id="cn">Cancel</button><button class="btn pri" id="ok" style="background:var(--red)">${esc(ok)}</button></div>`);
  b.querySelector("#cn").onclick=()=>{closeModal();res(false)};b.querySelector("#ok").onclick=()=>{closeModal();res(true)}})}

function statusModal(p){
  const b=modal(`<h3>Add step — ${esc(p.name)}</h3><div class="small">Added to the course in date order.</div><div id="sb"></div>
  <div class="small" style="margin-top:14px;font-weight:600">Still waiting for… (update or clear)</div>${waitingFields(nextStepOf(p),nextDateOf(p))}
  <div class="actions"><button class="btn" id="cn">Cancel</button><button class="btn pri" id="ok">Save</button></div>`);
  const nextOf={admitted:"operated",operated:"discharged",discharged:"readmitted",readmitted:"operated"};
  const box=b.querySelector("#sb");statusFields(box,{status:nextOf[p.status]||"admitted",date:today(),counts:{adm:kindCount(p,"adm"),op:kindCount(p,"op"),dis:kindCount(p,"dis")}});attachLearn(b);
  b.querySelector("#cn").onclick=closeModal;
  b.querySelector("#ok").onclick=async e=>{
    const sv=readStatus(box);rememberForm(b);e.target.disabled=true;e.target.textContent="Saving…";
    const now=Date.now();const cur=patients.find(x=>x.id===p.id)||p;
    const np=Object.assign({},cur,{status:sv.status,statusDate:sv.date,statusNote:sv.note,
      nextStep:b.querySelector("#nstep").value.trim(),nextDate:b.querySelector("#ndate").value||"",
      history:[...(cur.history||[]),{status:sv.status,date:sv.date,note:sv.note,by:CFG.name,at:now}],updatedAt:now,updatedBy:CFG.name});
    try{await savePatient(np);closeModal();toast("Condition updated");render()}
    catch(err){e.target.disabled=false;e.target.textContent="Save";toast(err.message)}
  };
}
function waitingModal(p){
  const b=modal(`<h3>Waiting for — ${esc(p.name)}</h3>${waitingFields(nextStepOf(p),nextDateOf(p))}
  <div class="actions"><button class="btn" id="cn">Cancel</button><button class="btn danger" id="clr">Nothing pending</button><button class="btn pri" id="ok">Save</button></div>`);
  b.querySelector("#cn").onclick=closeModal;attachLearn(b);
  const save=async(step,date,btn)=>{rememberForm(b);btn.disabled=true;const cur=patients.find(x=>x.id===p.id)||p;
    const np=Object.assign({},cur,{nextStep:step,nextDate:date,updatedAt:Date.now(),updatedBy:CFG.name});
    try{await savePatient(np);closeModal();render()}catch(err){btn.disabled=false;toast(err.message)}};
  b.querySelector("#ok").onclick=e=>save(b.querySelector("#nstep").value.trim(),b.querySelector("#ndate").value||"",e.target);
  b.querySelector("#clr").onclick=e=>save("","",e.target);
}
function latestOf(h){if(!h.length)return null;return h.map((x,i)=>({x,i})).sort((a,b)=>(a.x.date||"").localeCompare(b.x.date||"")||(a.x.at||0)-(b.x.at||0)||a.i-b.i).pop().x}
async function removeHistory(p,i){
  const cur=patients.find(x=>x.id===p.id)||p;const hist=[...(cur.history||[])];const h=hist[i];if(!h)return;
  if(!await confirmBox("Remove history entry?",`${st(h.status).label} on ${fmt(h.date)} will be removed.`,"Remove"))return;
  hist.splice(i,1);const L=latestOf(hist);
  const np=Object.assign({},cur,{history:hist,updatedAt:Date.now(),updatedBy:CFG.name});
  if(L)Object.assign(np,{status:L.status,statusDate:L.date,statusNote:L.note||""});
  try{await savePatient(np);render()}catch(err){toast(err.message)}
}
async function deletePatient(p){
  if(!await confirmBox("Delete patient?",`${p.name} and all their photos and videos will be deleted for everyone in the unit.`,"Delete"))return;
  toast("Deleting…",1500);
  try{await api("deletePatient",{id:p.id});patients=patients.filter(x=>x.id!==p.id);media=media.filter(m=>m.patientId!==p.id);go("");toast("Deleted")}
  catch(err){toast(err.message)}
}

/* ================= upload + compression ================= */
function moveMedia(p,ids,defDate,done){
  const opts=ADD_BTNS.flatMap(([k,lab,ask])=>ask?[[k+"_new",lab+" — New"],[k+"_old",lab+" — Old"]]:[[k,lab]]);
  const b=modal(`<h3>Move ${ids.length>1?ids.length+" files":"file"} to…</h3>
    <label class="f">Date of the film (used for Old)</label><input class="inp" type="date" id="sd" value="${esc(defDate||today())}">
    <div class="addrow">${opts.map(([c,lab])=>`<button type="button" class="btn" data-c="${c}">${lab}</button>`).join("")}</div>
    <div class="actions"><button type="button" class="btn full" id="sc">Cancel</button></div>`);
  b.querySelector("#sc").onclick=()=>{closeModal();};
  b.querySelectorAll("[data-c]").forEach(x=>x.onclick=async()=>{
    const cur=patients.find(y=>y.id===p.id)||p;const mcat=Object.assign({},cur.mediaCat||{});const ma=Object.assign({},cur.mediaAge||{});
    const c=x.dataset.c,d=b.querySelector("#sd").value||today();
    ids.forEach(id=>{const m=media.find(y=>y.id===id)||{};mcat[id]={cat:c,date:c.endsWith("_old")?d:(c.endsWith("_new")?today():(m.date||today()))};delete ma[id]});
    try{await savePatient(Object.assign({},cur,{mediaCat:mcat,mediaAge:ma}));closeModal();toast("Moved");(done||render)()}catch(err){toast(err.message)}});
}
function chooseCat(btn,cb){
  if(!btn.dataset.ask){cb(btn.dataset.cat,today());return}
  const k=btn.dataset.cat,l=BASES[k][0];
  const b=modal(`<h3>${l} — new or old?</h3>
    <div class="actions"><button type="button" class="btn pri full" id="n">New ${l} (today)</button></div>
    <div class="hint">New moves the earlier new ${l} to Old automatically.</div>
    <label class="f">Old ${l} — date of the film</label><input class="inp" type="date" id="od" value="${today()}">
    <div class="actions"><button type="button" class="btn full" id="o">Add as Old ${l}</button><button type="button" class="btn full" id="c">Cancel</button></div>`);
  b.querySelector("#n").onclick=()=>{closeModal();cb(k+"_new",today())};
  b.querySelector("#o").onclick=()=>{const d=b.querySelector("#od").value||today();closeModal();cb(k+"_old",d)};
  b.querySelector("#c").onclick=closeModal;
}
function pickFiles(cb){
  const i=document.createElement("input");i.type="file";i.accept="image/*,video/*";i.multiple=true;
  i.onchange=()=>{const f=[...i.files];if(f.length)cb(f)};i.click();
}
async function uploadFiles(p,items){
  const b=modal(`<h3>Adding ${items.length} file${items.length>1?"s":""} — ${esc(p.name)}</h3>
  <div class="hint">Compressing to the smallest readable size, then uploading. Keep the screen on while videos compress.</div>
  <div id="pp" class="small" style="margin-top:10px">Starting…</div><div class="prog"><div id="pb"></div></div>
  <div class="actions"><button class="btn" id="cn">Stop</button></div>`);
  $("#layer").dataset.lock="1";
  let cancelled=false;b.querySelector("#cn").onclick=()=>{cancelled=true};
  const msg=t=>{const x=b.querySelector("#pp");if(x)x.textContent=t};
  const bar=f=>{const x=b.querySelector("#pb");if(x)x.style.width=Math.round(f*100)+"%"};
  let ok=0,saved=0;
  for(let i=0;i<items.length&&!cancelled;i++){
    const {file:f,cat}=items[i];const fdate=items[i].date||today();const tag=`${i+1}/${items.length}`;
    const part=(x)=>bar((i+x)/items.length);
    try{
      let r;
      if(f.type.startsWith("video")){msg(`Compressing video ${tag}…`);r=await compressVideo(f,x=>part(x*0.8));}
      else{msg(`Compressing photo ${tag}…`);r=await compressImage(f);}
      if(r.blob.size>35*1048576)throw new Error("still over 35 MB after compression — trim the video");
      saved+=Math.max(0,f.size-r.blob.size);
      msg(`Uploading ${tag} (${mb(r.blob.size)})…`);part(.85);
      const m=await api("upload",{patientId:p.id,patientName:p.name,cat,kind:r.kind,mime:r.blob.type,
        name:`${catLabel(cat)} ${fdate} ${i+1}.${r.ext}`,b64:await toB64(r.blob),thumb:r.thumb||"",date:fdate});
      media.push(m);thumbs[m.id]=r.thumb||"";ok++;
      try{const c=await mediaCache();if(c)await c.put("/__media/"+m.fileId,new Response(r.blob))}catch(_){}
      part(1);
    }catch(err){toast(`File ${tag} failed: ${err.message}`,4000)}
  }
  closeModal();
  if(ok)toast(`${ok} file${ok>1?"s":""} added · saved ${mb(saved)} by compressing`);
  try{localStorage.setItem("ortho_cache",JSON.stringify({patients,media}))}catch(_){}
  render();
}
function toB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(blob)})}
function canvasThumb(src,w,h){const k=Math.min(1,THUMB/Math.max(w,h));const c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext("2d").drawImage(src,0,0,c.width,c.height);return c.toDataURL("image/jpeg",0.6)}
async function compressImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("can't read image"));i.src=url});
    let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,IMG_MAX/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    let blob=await new Promise(r=>c.toBlob(r,"image/jpeg",IMG_Q));
    if(file.type==="image/jpeg"&&file.size<blob.size)blob=file;
    return{blob,kind:"image",ext:"jpg",thumb:canvasThumb(img,img.naturalWidth,img.naturalHeight)};
  }finally{URL.revokeObjectURL(url)}
}
async function compressVideo(file,onp){
  const types=["video/mp4;codecs=avc1.42E01E","video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"];
  const mime=window.MediaRecorder&&types.find(t=>MediaRecorder.isTypeSupported(t));
  const url=URL.createObjectURL(file);
  const v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="auto";v.src=url;
  try{
    await new Promise((res,rej)=>{v.onloadeddata=res;v.onerror=()=>rej(new Error("can't read this video"))});
    let thumb=null;try{thumb=canvasThumb(v,v.videoWidth,v.videoHeight)}catch(_){}
    if(!mime||!HTMLCanvasElement.prototype.captureStream){return{blob:file,kind:"video",ext:file.type.includes("webm")?"webm":"mp4",thumb}}
    let w=v.videoWidth,h=v.videoHeight;const k=Math.min(1,VID_MAX/Math.max(w,h));w=Math.round(w*k/2)*2;h=Math.round(h*k/2)*2;
    const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");
    const rec=new MediaRecorder(c.captureStream(VID_FPS),{mimeType:mime,videoBitsPerSecond:VID_BPS});
    const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    const stopped=new Promise(r=>rec.onstop=r);
    let done=false;
    const draw=()=>{if(done)return;x.drawImage(v,0,0,w,h);if(v.duration)onp&&onp(v.currentTime/v.duration);
      if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(draw);else requestAnimationFrame(draw)};
    const ended=new Promise(r=>v.onended=r);
    x.drawImage(v,0,0,w,h);rec.start(1000);await v.play();draw();
    await ended;done=true;x.drawImage(v,0,0,w,h);
    await new Promise(r=>setTimeout(r,250));rec.stop();await stopped;
    const type=mime.split(";")[0];const out=new Blob(chunks,{type});
    if(!out.size||out.size>=file.size)return{blob:file,kind:"video",ext:file.type.includes("webm")?"webm":"mp4",thumb};
    return{blob:out,kind:"video",ext:type.includes("mp4")?"mp4":"webm",thumb};
  }finally{URL.revokeObjectURL(url)}
}

/* ================= viewer ================= */
function viewer(p,mid){
  const gl=mediaGroups(p).flatMap(g=>g.items.map(m=>({m,g})));const ms=gl.map(x=>x.m);
  let i=Math.max(0,ms.findIndex(m=>m.id===mid));const l=$("#layer");let objUrl=null;
  async function draw(){
    const m=ms[i];if(!m){l.innerHTML="";return}
    if(objUrl){URL.revokeObjectURL(objUrl);objUrl=null}
    l.innerHTML=`<div class="viewer"><div class="vb"><button id="vc">✕ Close</button><span>${esc(gl[i].g.label)} · ${i+1}/${ms.length}</span><span><button id="vs">Section</button> <button id="vd">Delete</button></span></div>
    <div class="media" id="vm">Loading…</div>
    <div class="vb"><button id="vp" ${i===0?"disabled":""}>‹ Prev</button><span>${gl[i].g.age?`<button id="vmv">Move to ${gl[i].g.age==="new"?"Old":"New"}</button>`:""} ${m.by?esc(m.by):""}${m.size?" · "+mb(m.size):""}</span><button id="vn" ${i>=ms.length-1?"disabled":""}>Next ›</button></div></div>`;
    l.querySelector("#vc").onclick=()=>{if(objUrl)URL.revokeObjectURL(objUrl);l.innerHTML=""};
    l.querySelector("#vp").onclick=()=>{if(i>0){i--;draw()}};
    l.querySelector("#vn").onclick=()=>{if(i<ms.length-1){i++;draw()}};
    l.querySelector("#vs").onclick=()=>moveMedia(p,[m.id],m.date,()=>{l.innerHTML="";render()});
    const mv=l.querySelector("#vmv");if(mv)mv.onclick=async()=>{
      const cur=patients.find(x=>x.id===p.id)||p;const ma=Object.assign({},cur.mediaAge||{});
      ma[m.id]={age:gl[i].g.age==="new"?"old":"new",at:today()};
      try{await savePatient(Object.assign({},cur,{mediaAge:ma}));l.innerHTML="";toast("Moved");render()}catch(err){toast(err.message)}};
    l.querySelector("#vd").onclick=async()=>{
      if(!await confirmBox("Delete this file?","It will be removed for everyone.","Delete"))return draw();
      try{await api("deleteMedia",{id:m.id});media=media.filter(x=>x.id!==m.id);toast("Deleted");render()}catch(err){toast(err.message)}};
    try{const b=await getBlob(m);if(!ms[i]||ms[i].id!==m.id||!l.querySelector("#vm"))return;objUrl=URL.createObjectURL(b);
      l.querySelector("#vm").innerHTML=m.kind==="video"?`<video src="${objUrl}" controls playsinline autoplay></video>`:`<img src="${objUrl}" alt="">`;
    }catch(err){const e=l.querySelector("#vm");if(e)e.textContent="Couldn't load: "+err.message}
  }
  draw();
}
</script>
